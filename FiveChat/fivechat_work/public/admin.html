<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiveChat Admin v62</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff;padding:24px}button,input{padding:10px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff}button{cursor:pointer}.top{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.card{background:#121a2d;border:1px solid #26324a;border-radius:16px;padding:16px}.metric{font-size:28px;font-weight:800}.muted{opacity:.65}table{width:100%;border-collapse:collapse}.wrap{overflow:auto}.actions{display:flex;gap:5px;flex-wrap:wrap}td,th{padding:9px;border-bottom:1px solid #26324a;text-align:left}h1{margin-top:0}</style></head><body><h1>FiveChat Administrator</h1><div class="top"><input id="secret" type="password" placeholder="ADMIN_SECRET"><button onclick="loadAll()">Load dashboard</button></div><div id="metrics" class="grid"></div><div class="card"><h2>Users</h2><div class="wrap"><table><thead><tr><th>User</th><th>Status</th><th>Joined</th><th>Last seen</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="card"><h2>Reports</h2><pre id="reports" class="muted">Load dashboard</pre></div><div class="card"><h2>Activity logs</h2><pre id="activity" class="muted">Load dashboard</pre></div><div class="card"><h2>System errors</h2><pre id="errors" class="muted">Load dashboard</pre></div><script>const $=id=>document.getElementById(id),h=()=>({'x-admin-secret':$('secret').value});async function api(u,o={}){o.headers={...(o.headers||{}),...h(),'Content-Type':'application/json'};const r=await fetch(u,o);return r.json()}async function loadAll(){const m=await api('/api/admin/metrics');if(m.error)return alert(m.error);$('metrics').innerHTML=Object.entries(m).filter(([k])=>k!=='database').map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="metric">${typeof v==='number'?v.toLocaleString():v}</div></div>`).join('');const u=await api('/api/admin/users');$('users').innerHTML=(u.users||[]).map(x=>`<tr><td>${x.name}</td><td>${x.suspended?'Suspended':x.online?'Online':'Offline'}</td><td>${new Date(x.createdAt).toLocaleString()}</td><td>${x.lastSeen?new Date(x.lastSeen).toLocaleString():'—'}</td><td class="actions"><button onclick="act('${x.name}','${x.suspended?'restore':'suspend'}')">${x.suspended?'Restore':'Suspend'}</button><button onclick="act('${x.name}','delete')">Delete</button></td></tr>`).join('');const r=await api('/api/admin/reports');$('reports').textContent=JSON.stringify(r.reports||[],null,2);const a=await api('/api/admin/activity');$('activity').textContent=JSON.stringify(a.activity||[],null,2);const e=await api('/api/admin/errors');$('errors').textContent=JSON.stringify(e.errors||[],null,2)}async function act(name,action){if(action==='delete'&&!confirm('Delete '+name+'?'))return;await api('/api/admin/user-action',{method:'POST',body:JSON.stringify({name,action})});loadAll()}</script></body></html>

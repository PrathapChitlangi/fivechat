<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveChat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
        }
        
        /* Fixed Chat Composer Styles based on requirements */
        .composer {
          position: fixed;
          bottom: 0;
          left: 0;
          width: 100%;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 12px 16px;
          background-color: #121212;
          z-index: 100;
          border: none;
          outline: none;
        }

        .input-wrapper {
          flex: 1;
          min-width: 0;
          display: flex;
          align-items: center;
          background-color: #2a2a2a;
          border-radius: 24px;
          padding: 0 16px;
          box-sizing: border-box;
          position: relative;
          border: none !important;
          box-shadow: none !important;
          outline: none !important;
        }

        /* Prevent rogue lines */
        .input-wrapper::before,
        .input-wrapper::after,
        .composer::before,
        .composer::after {
          display: none !important;
          content: none !important;
        }

        .input-wrapper input {
          width: 100%;
          box-sizing: border-box;
          background: transparent;
          color: #ffffff;
          border: none;
          outline: none;
          padding: 14px 0;
          font-size: 16px;
          line-height: 1.5;
          box-shadow: none;
        }

        .input-wrapper input:focus {
          outline: none !important;
          border: none !important;
          box-shadow: none !important;
          background: transparent !important;
        }

        .input-wrapper input::placeholder {
          color: #888888;
          vertical-align: middle;
        }

        .send-button {
          flex-shrink: 0;
          background-color: #007bff;
          color: #ffffff;
          border: none;
          border-radius: 24px;
          padding: 12px 20px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          outline: none;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        @media (max-width: 600px) {
          .composer { padding: 10px 12px; gap: 8px; }
          .input-wrapper { padding: 0 12px; }
          .input-wrapper input { padding: 12px 0; font-size: 15px; }
          .send-button { padding: 10px 16px; }
        }
    </style>
</head>
<body>

    <div class="composer">
      <div class="input-wrapper">
        <input type="text" placeholder="Write a message…" id="chat-input" />
      </div>
      <button class="send-button" id="send-btn">Send</button>
    </div>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FiveChat — No Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="joinScreen" class="card">
      <div class="logo">💬 FiveChat</div>
      <h1>Private chat for up to 5 people</h1>
      <p class="muted">No account. No login. No invitation links.</p>

      <label>Your name</label>
      <input id="name" maxlength="30" placeholder="e.g. Prathap" autocomplete="off">

      <label>Room name</label>
      <input id="room" maxlength="30" placeholder="e.g. TeamRoom" autocomplete="off">

      <p class="hint">Tell your friends the <b>room name</b>. They can open this website and type the same room name. No link sharing is needed.</p>
      <button id="joinBtn">Enter Chat</button>
      <p id="error" class="error"></p>
    </section>

    <section id="chatScreen" class="chat hidden">
      <header>
        <div>
          <strong>💬 <span id="roomTitle"></span></strong>
          <small id="status">Connected</small>
        </div>
        <button id="leaveBtn" class="secondary">Leave</button>
      </header>

      <aside>
        <h3>Members <span id="count"></span></h3>
        <ul id="members"></ul>
        <div class="room-note">Maximum 5 members<br>Messages retained for 24 hours.</div>
      </aside>

      <section class="messages" id="messages"></section>

      <form id="form" class="composer">
        <input id="message" maxlength="1000" placeholder="Type a message…" autocomplete="off">
        <button>Send</button>
      </form>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>

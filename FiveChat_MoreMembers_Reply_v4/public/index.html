<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5cf0"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"><title>FiveChat</title></head><body><div class="orb o1"></div><div class="orb o2"></div><main class="app">
<section id="joinScreen" class="card"><div class="logo">💬 FiveChat</div><h1>Chat with your people.</h1><p>No login • Up to 5 people</p><label>Your name</label><input id="name" maxlength="30" placeholder="e.g. Prathap"><label>Room name</label><input id="room" maxlength="40" placeholder="e.g. OfficeFriends"><div class="hint">Everyone enters the same room name. Messages are stored for at least 24 hours when MongoDB is connected.</div><button id="joinBtn">Enter Chat →</button><button id="notifyBtn" class="ghost">🔔 Enable notifications</button><div id="error"></div></section>
<section id="chatScreen" class="chat hidden"><header><div class="roomhead"><b>💬 <span id="roomTitle"></span></b><small>🟢 Connected</small></div><div><button id="notifyChatBtn" class="icon">🔔</button><button id="leaveBtn" class="secondary">Leave</button></div></header><aside><h3>Members <span id="count"></span></h3><ul id="members"></ul><small>🟢 Online<br><br>Maximum 20 members<br>24-hour message retention</small></aside><section id="messages" class="messages"><div id="empty" class="empty">Say hello 👋</div><div id="typing"></div></section><div id="replyBar" class="reply-bar hidden"><div><b>↩ Replying to <span id="replyName"></span></b><div id="replyPreview"></div></div><button id="cancelReply" type="button">×</button></div><form id="form"><input id="message" maxlength="2000" placeholder="Type a message…"><button>Send</button></form></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
